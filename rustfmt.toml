# Lens Format Style

edition = "2024"

# The "Default" setting has a heuristic which splits lines too aggresively.
# We are willing to revisit this setting in future versions of rustfmt.
# Bugs:
#   * https://github.com/rust-lang/rustfmt/issues/3119
#   * https://github.com/rust-lang/rustfmt/issues/3120
use_small_heuristics = "Max"

# Prevent carriage returns
newline_style = "Unix"

# Format imports. Nightly-only, which is why `make fmt` runs cargo +nightly
# while every other cargo invocation stays on the pinned stable toolchain.
imports_granularity = "Module"
