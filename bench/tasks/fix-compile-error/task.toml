name = "fix-compile-error"
summary = "One root cause, many cascading diagnostics"

# The shape that punishes naive ranking: every diagnostic looks equally like an
# error, and all but one of them disappear when the first is fixed. A filter
# that keeps "the errors" keeps the wrong ones.
prompt = """
This program does not compile. Build it with:

    {lens} rustc --edition 2021 -o /dev/null session.rs

Find the root cause, fix session.rs so it compiles, and build again to confirm.
Keep the behaviour: expires_at is optional and a missing expiry means the
session never expires.
"""

turn_limit = 20
timeout_s = 300
