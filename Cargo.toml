[package]
name = "lens"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/misttech/lens"
description = "Run a command, keep its full output, show an agent the view worth spending context on"

# Keep the dependency tree small. Approved: regex, serde + toml, anyhow, and
# serde_json. Anything else needs a written justification in the commit that
# adds it.
[dependencies]
# Lens files are TOML. Writing them by hand would be fine; parsing nested
# tables, arrays of stages, and `extends` is the larger liability — the same
# argument that brought serde_json in for meta.json.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The integration tests assert on the log's JSON shape, which is a published
# contract — reading it as text and grepping would not catch a field
# quietly changing type.
serde_json = "1"

# The library and binary have no #[bench] functions, and cargo would otherwise
# run their test harnesses in bench mode — where they reject this benchmark's
# own flags and report "0 measured", which reads like a benchmark that found
# nothing rather than one that was never asked to run.
[lib]
bench = false

[[bin]]
name = "lens"
bench = false

[[bench]]
name = "pipeline"
# No harness: this is a program that measures and gates, not a set of #[bench]
# functions. criterion would be a large tree for arithmetic that fits on a
# screen, and the gate needs to decide its own exit code.
harness = false

[profile.release]
# The whole tool has a ~10ms wall budget, and it is a single short-lived
# process: optimize for its own startup and throughput, not for build time.
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

